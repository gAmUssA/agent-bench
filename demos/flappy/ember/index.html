<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    background: #70c5ce;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  // ---- Sizing (CSS pixels are our world units; canvas is scaled by DPR) ----
  var W = 0, H = 0, dpr = 1;
  var safeTop = 0, safeBottom = 0;

  function readSafeArea() {
    var cs = getComputedStyle(document.documentElement);
    function probe(prop) {
      // env() resolves to 0 in computed style unless applied to a real property;
      // use a temporary element to read the resolved env() value.
      var el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.visibility = 'hidden';
      el.style.paddingTop = 'env(' + prop + ', 0px)';
      document.body.appendChild(el);
      var v = parseFloat(getComputedStyle(el).paddingTop) || 0;
      document.body.removeChild(el);
      return v;
    }
    safeTop = probe('safe-area-inset-top');
    safeBottom = probe('safe-area-inset-bottom');
  }

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    readSafeArea();
    computeLayout();
    syncHook();
  }

  // ---- Game constants (recomputed from viewport for responsiveness) ----
  var GROUND_H, BIRD_X, BIRD_R, PIPE_W, PIPE_GAP, PIPE_SPACING, PIPE_SPEED,
      GRAVITY, FLAP_V, MAX_FALL;

  function computeLayout() {
    GROUND_H = Math.max(60, Math.round(H * 0.12)) + safeBottom;
    BIRD_R = Math.max(12, Math.min(20, Math.round(Math.min(W, H) * 0.045)));
    BIRD_X = Math.round(W * 0.28);
    PIPE_W = Math.max(52, Math.round(W * 0.16));
    PIPE_GAP = Math.round(H * 0.24);
    PIPE_SPACING = Math.round(Math.max(W * 0.62, PIPE_W + 160));
    PIPE_SPEED = Math.max(140, W * 0.42);      // px/s
    GRAVITY = H * 2.6;                          // px/s^2
    FLAP_V = -H * 0.82;                         // px/s
    MAX_FALL = H * 1.4;
  }

  // ---- State ----
  var game = {
    state: 'ready',   // "ready" | "playing" | "over"
    score: 0,
    bird: { x: 0, y: 0, r: 0 },
    pipes: []         // [{x, width, gapTop, gapBottom}]
  };
  window.game = game;

  var best = 0;
  try { best = parseInt(localStorage.getItem('flappyBest'), 10) || 0; } catch (e) {}

  var birdVy = 0, birdRot = 0, flapTime = 1; // flapTime seconds since last flap
  var scrollX = 0; // for ground/ready-screen parallax
  var newBest = false;

  function syncHook() {
    game.bird.x = BIRD_X;
    game.bird.r = BIRD_R;
    // y updated in loop
  }

  function resetGame() {
    game.score = 0;
    game.pipes.length = 0;
    game.bird.y = H * 0.45;
    birdVy = 0;
    birdRot = 0;
    flapTime = 1;
    newBest = false;
    syncHook();
  }

  function spawnPipe(x) {
    var margin = Math.max(40, H * 0.06) + safeTop;
    var groundTop = H - GROUND_H;
    var minTop = margin;
    var maxTop = groundTop - PIPE_GAP - margin;
    var gapTop = minTop + Math.random() * Math.max(10, maxTop - minTop);
    game.pipes.push({
      x: x,
      width: PIPE_W,
      gapTop: gapTop,
      gapBottom: gapTop + PIPE_GAP
    });
  }

  function startPlaying() {
    resetGame();
    game.state = 'playing';
    spawnPipe(W + PIPE_W);
    flap();
  }

  function flap() {
    birdVy = FLAP_V;
    flapTime = 0;
  }

  function gameOver() {
    if (game.state !== 'playing') return;
    game.state = 'over';
    if (game.score > best) {
      best = game.score;
      newBest = true;
      try { localStorage.setItem('flappyBest', String(best)); } catch (e) {}
    }
    // freeze pipes; bird will still tumble to the ground in update()
  }

  // ---- Input ----
  function onTap() {
    if (game.state === 'ready') {
      startPlaying();
    } else if (game.state === 'playing') {
      flap();
    } else if (game.state === 'over') {
      startPlaying();
    }
  }

  window.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    onTap();
  }, { passive: false });

  window.addEventListener('touchstart', function (e) {
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      onTap();
    }
  });

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  // ---- Update (fixed timestep, refresh-rate independent) ----
  var lastT = 0, acc = 0;
  var STEP = 1 / 240;

  function update(dt) {
    var groundTop = H - GROUND_H;

    if (game.state === 'ready') {
      scrollX += PIPE_SPEED * 0.5 * dt;
      // gentle bob
      game.bird.y = H * 0.45 + Math.sin(performance.now() / 350) * H * 0.012;
      birdRot = Math.sin(performance.now() / 350) * 0.08;
      return;
    }

    // bird physics
    birdVy = Math.min(birdVy + GRAVITY * dt, MAX_FALL);
    game.bird.y += birdVy * dt;
    flapTime += dt;

    // tilt: up when rising, down when falling
    var target = birdVy < 0 ? -0.35 : Math.min(1.4, (birdVy / MAX_FALL) * 1.6);
    birdRot += (target - birdRot) * Math.min(1, dt * 12);

    if (game.state === 'playing') {
      scrollX += PIPE_SPEED * dt;

      // move pipes
      for (var i = 0; i < game.pipes.length; i++) {
        game.pipes[i].x -= PIPE_SPEED * dt;
      }
      // spawn
      var last = game.pipes[game.pipes.length - 1];
      if (!last || last.x + last.width < W - PIPE_SPACING + PIPE_W) {
        if (!last || last.x < W - PIPE_SPACING) spawnPipe(W + 10);
      }
      // cull
      while (game.pipes.length && game.pipes[0].x + game.pipes[0].width < -20) {
        game.pipes.shift();
      }
      // score
      for (var j = 0; j < game.pipes.length; j++) {
        var p = game.pipes[j];
        if (!p.scored && p.x + p.width < BIRD_X - BIRD_R) {
          p.scored = true;
          game.score++;
        }
      }
      // collisions
      var bx = BIRD_X, by = game.bird.y, r = BIRD_R * 0.92;
      if (by - r <= 0) { game.bird.y = r; gameOver(); }
      if (by + r >= groundTop) { game.bird.y = groundTop - r; gameOver(); }
      for (var k = 0; k < game.pipes.length; k++) {
        var q = game.pipes[k];
        if (bx + r > q.x && bx - r < q.x + q.width) {
          if (by - r < q.gapTop || by + r > q.gapBottom) { gameOver(); break; }
        }
      }
    } else if (game.state === 'over') {
      // dead bird tumbles to ground
      if (game.bird.y + BIRD_R >= groundTop) {
        game.bird.y = groundTop - BIRD_R;
        birdVy = 0;
      }
    }
  }

  // ---- Drawing ----
  function drawBackground() {
    // sky
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#5db9d6');
    g.addColorStop(0.7, '#9adfe8');
    g.addColorStop(1, '#cdeef2');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = 'rgba(255, 240, 170, 0.9)';
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.14, Math.min(W, H) * 0.07, 0, Math.PI * 2);
    ctx.fill();

    // clouds (parallax)
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    var cw = W * 0.9;
    for (var i = 0; i < 4; i++) {
      var cx = ((i * cw * 0.55 - scrollX * 0.25) % (cw * 1.2) + cw * 1.2) % (cw * 1.2) - cw * 0.1;
      var cy = H * (0.12 + i * 0.09);
      var s = Math.min(W, H) * (0.03 + i * 0.008);
      ctx.beginPath();
      ctx.arc(cx, cy, s, 0, Math.PI * 2);
      ctx.arc(cx + s * 1.1, cy + s * 0.25, s * 0.75, 0, Math.PI * 2);
      ctx.arc(cx - s * 1.1, cy + s * 0.3, s * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipe(p) {
    var groundTop = H - GROUND_H;
    var x = p.x, w = p.width;
    var capH = Math.max(14, w * 0.32);
    var capOver = Math.max(3, w * 0.06);

    function pipeBody(px, py, pw, ph) {
      if (ph <= 0) return;
      var grad = ctx.createLinearGradient(px, 0, px + pw, 0);
      grad.addColorStop(0, '#4da43a');
      grad.addColorStop(0.25, '#7ed957');
      grad.addColorStop(0.55, '#5cb843');
      grad.addColorStop(1, '#3a8a2c');
      ctx.fillStyle = grad;
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#2c6b20';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py, pw - 2, ph);
    }

    // top pipe
    pipeBody(x, -2, w, p.gapTop - capH);
    pipeBody(x - capOver, p.gapTop - capH, w + capOver * 2, capH);
    // bottom pipe
    pipeBody(x - capOver, p.gapBottom, w + capOver * 2, capH);
    pipeBody(x, p.gapBottom + capH, w, groundTop - p.gapBottom - capH + 2);
  }

  function drawGround() {
    var groundTop = H - GROUND_H;
    // grass strip
    ctx.fillStyle = '#7ed957';
    ctx.fillRect(0, groundTop, W, 12);
    ctx.fillStyle = '#5cb843';
    ctx.fillRect(0, groundTop + 12, W, 4);
    // dirt
    ctx.fillStyle = '#e8d89a';
    ctx.fillRect(0, groundTop + 16, W, H - groundTop - 16);
    // scrolling dirt stripes
    ctx.fillStyle = '#d9c581';
    var stripeW = 36, off = -(scrollX % (stripeW * 2));
    for (var x = off; x < W + stripeW; x += stripeW * 2) {
      ctx.fillRect(x, groundTop + 16, stripeW, H - groundTop - 16);
    }
  }

  function drawBird() {
    var bx = game.bird.x, by = game.bird.y, r = game.bird.r;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(birdRot);

    // wing flap animation (short, driven by flapTime)
    var wingAngle;
    if (flapTime < 0.35) {
      wingAngle = Math.sin((flapTime / 0.35) * Math.PI * 2) * 0.9;
    } else {
      wingAngle = Math.sin(performance.now() / 180) * 0.25;
    }

    // body
    ctx.fillStyle = '#ffd23e';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.15, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d9a416';
    ctx.lineWidth = 2;
    ctx.stroke();

    // belly
    ctx.fillStyle = '#ffe9a3';
    ctx.beginPath();
    ctx.ellipse(r * 0.15, r * 0.35, r * 0.65, r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // wing
    ctx.save();
    ctx.translate(-r * 0.25, -r * 0.1);
    ctx.rotate(-wingAngle);
    ctx.fillStyle = '#f4a920';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.7, r * 0.42, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d98d0f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(r * 0.45, -r * 0.3, r * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(r * 0.55, -r * 0.3, r * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#ff7f2a';
    ctx.beginPath();
    ctx.moveTo(r * 0.85, -r * 0.05);
    ctx.lineTo(r * 1.5, r * 0.12);
    ctx.lineTo(r * 0.85, r * 0.35);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawText(text, y, size, color, outline) {
    ctx.font = '700 ' + size + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (outline) {
      ctx.lineWidth = Math.max(2, size * 0.12);
      ctx.strokeStyle = outline;
      ctx.lineJoin = 'round';
      ctx.strokeText(text, W / 2, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function drawHUD() {
    var topY = safeTop + H * 0.09;
    if (game.state === 'playing') {
      drawText(String(game.score), topY, Math.round(H * 0.07), '#fff', 'rgba(0,0,0,0.45)');
    } else if (game.state === 'ready') {
      drawText('Flappy Bird', safeTop + H * 0.18, Math.round(H * 0.055), '#fff', 'rgba(0,0,0,0.45)');
      // pulsing prompt
      var a = 0.65 + 0.35 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = a;
      drawText('Tap to start', H * 0.68, Math.round(H * 0.038), '#fff', 'rgba(0,0,0,0.45)');
      ctx.globalAlpha = 1;
    } else if (game.state === 'over') {
      var cy = safeTop + H * 0.2;
      // panel
      var pw = Math.min(W * 0.8, 340), ph = H * 0.24;
      ctx.fillStyle = 'rgba(255, 250, 220, 0.95)';
      ctx.strokeStyle = '#d9a416';
      ctx.lineWidth = 3;
      roundRect(W / 2 - pw / 2, cy - ph / 2, pw, ph, 14);
      ctx.fill();
      ctx.stroke();

      drawText('GAME OVER', cy - ph * 0.28, Math.round(H * 0.038), '#e0562e');
      drawText('Score  ' + game.score, cy + ph * 0.02, Math.round(H * 0.034), '#5a4a1a');
      drawText((newBest ? 'NEW Best  ' : 'Best  ') + best, cy + ph * 0.28, Math.round(H * 0.03), newBest ? '#e0562e' : '#5a4a1a');

      var a2 = 0.65 + 0.35 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = a2;
      drawText('Tap to restart', H * 0.72, Math.round(H * 0.036), '#fff', 'rgba(0,0,0,0.45)');
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Main loop ----
  function frame(t) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = Math.min(0.1, (t - lastT) / 1000);
    lastT = t;
    acc += dt;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }

    drawBackground();
    for (var i = 0; i < game.pipes.length; i++) drawPipe(game.pipes[i]);
    drawGround();
    drawBird();
    drawHUD();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 50);
  });

  resize();
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
